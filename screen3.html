<!doctype html><html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Grand Quiz — Finale Discord</title><style>*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% 10%,#174681,#08142c 70%);color:white;font:18px system-ui,Arial;min-height:100vh}main{width:min(1250px,96vw);margin:0 auto;padding:20px 0 30px}h1{text-align:center;font-size:clamp(24px,3vw,44px);letter-spacing:.07em;margin:10px 0 25px;text-shadow:0 3px 10px #000}.grid{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:clamp(4px,.8vw,12px)}.cell{aspect-ratio:1.32;border:2px solid #d4e5ff;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:clamp(16px,3vw,38px);font-weight:800;box-shadow:0 4px 12px #0006;text-shadow:0 2px 5px #0007}.rouge{background:linear-gradient(135deg,#e65c6c,#8e1c31)}.jaune{background:linear-gradient(135deg,#f7d25d,#ae7711);color:#182036;text-shadow:none}.vert{background:linear-gradient(135deg,#46c995,#17674c)}.violet{background:linear-gradient(135deg,#ad82ef,#59349b)}.blanc{background:linear-gradient(135deg,#fff,#cfd8e6);color:#1c2c47;text-shadow:none}.bleu{background:linear-gradient(145deg,#367acb,#143c82)}.used{background:#384354;color:#8793a7;border-color:#657087;text-decoration:line-through;box-shadow:none}.panel{background:linear-gradient(135deg,#1b56a1,#0b2859);border:4px solid #e2edff;border-radius:25px;box-shadow:0 14px 50px #0009;padding:clamp(20px,4vw,55px);margin:5vh auto;text-align:center;max-width:1000px;min-height:45vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px}.title{font-size:clamp(25px,3.5vw,48px);font-weight:900}.topic{font-size:clamp(18px,2.2vw,30px);display:flex;align-items:center;gap:14px;justify-content:center}.dot{width:26px;height:26px;border-radius:50%;border:2px solid white;display:inline-block}.question{font-size:clamp(24px,3vw,44px);font-weight:700;line-height:1.4}.answer{font-size:clamp(20px,2.5vw,34px);color:#d4ffe9;font-weight:700}.pill{border:2px solid #a8c9ff;border-radius:12px;padding:12px 26px;color:#d6e9ff;font-size:22px}.scores{display:flex;flex-wrap:wrap;justify-content:center;gap:20px;margin:20px 0}.score{background:#0d254a;border:1px solid #6486b9;padding:10px 22px;border-radius:10px}.hint{text-align:center;color:#aabfe1}#questionPanel{display:none}</style><main><h1>🏆 GRANDE FINALE 🏆</h1><div id="gridPanel"><div id="grid" class="grid"></div><div class="scores" id="scores"></div><p id="hint" class="hint">En attente de l'organisateur…</p></div><div id="questionPanel" class="panel"><div id="qnumber" class="title"></div><div id="topic" class="topic"></div><div id="question" class="question"></div><div id="answer" class="answer"></div></div></main><script>
let last=-1;const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function poll(){try{const r=await fetch('/api/manche3/state',{cache:'no-store'});if(!r.ok)throw Error('Serveur indisponible');const s=await r.json();if(s.version===last)return;last=s.version;const question=s.phase==='question'&&s.active;$('gridPanel').style.display=question?'none':'block';$('questionPanel').style.display=question?'flex':'none';if(question){$('qnumber').textContent='QUESTION '+s.active.number;$('topic').innerHTML=`<span class="dot ${s.active.color}"></span>${esc(s.active.theme)}`;$('question').textContent=s.active.question;$('answer').innerHTML=s.revealed?`Réponse : ${esc(s.active.answer)}`:'<span class="pill">RÉPONSE</span>'}else{$('grid').innerHTML=s.cells.map(c=>`<div class="cell ${c.used?'used':s.colorsVisible?c.color:'bleu'}">${c.number}</div>`).join('');$('hint').textContent=s.phase==='setup'?'En attente de la génération de la grille':s.colorsVisible?'Mémorisez les couleurs !':'Choisissez un numéro parmi les cases bleues';$('scores').innerHTML=s.finalists.map((id,i)=>{const p=s.players.find(x=>x.id===id);return `<span class="score">${['🔴','🟡','🟢','🟣'][i]} ${esc(p?.name)} : <b>${s.scores[id]||0}</b></span>`}).join('')}}catch(e){$('hint').textContent='Connexion en cours…'}}poll();setInterval(poll,1200);
</script></html>
