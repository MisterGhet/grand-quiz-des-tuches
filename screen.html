<!doctype html><html lang="fr"><meta charset="utf-8"><title>Tuches — Écran Discord</title><style>body{background:radial-gradient(#253b65,#0b1124);color:white;font:30px system-ui;text-align:center;padding:5vh 6vw}.tag{color:#f6c55f;font-size:22px}h1{font-size:50px}#choices{display:grid;grid-template-columns:1fr 1fr;gap:24px}article{background:#1d2d4b;border:2px solid #435779;border-radius:20px;padding:28px}article.good{background:#176940;border-color:#44e7a1}#clock{font-size:55px;color:#f6c55f}#clock.red{color:#ff6475}</style><div class="tag" id="tag">GRAND QUIZ DES TUCHES</div><h1 id="question">En attente de la prochaine question…</h1><div id="choices"></div><p id="clock"></p><section id="rank" style="font-size:20px;margin-top:24px"></section><script>async function poll(){try{let s=await(await fetch('/api/state')).json();document.getElementById('tag').textContent=s.visible?'QUESTION '+(s.current+1)+' / 20 · '+s.type:'GRAND QUIZ DES TUCHES';document.getElementById('question').textContent=s.visible?s.question||'Question à compléter':'En attente de la prochaine question…';document.getElementById('choices').innerHTML=s.visible?s.answers.map((a,i)=>'<article class="'+(s.revealed&&i===s.correct?'good':'')+'"><b>'+ 'ABCD'[i]+'</b> · '+escape(a)+'</article>').join(''):'';let c=document.getElementById('clock'),n=s.deadline?Math.max(0,Math.ceil((s.deadline-Date.now())/1000)):null;c.textContent=s.visible&&!s.revealed&&n!==null?(n===0?'TEMPS ÉCOULÉ':n+' s'):'';c.className=n!==null&&n<=5?'red':'';document.getElementById('rank').innerHTML=s.ranking?.length?'<b>🏆 Classement</b><p>'+s.ranking.map((p,i)=>(i+1)+'. '+escape(p.name)+' : '+p.score+' pt'+(p.score>1?'s':'')).join(' · ')+'</p>':''}catch(e){}}function escape(x){return String(x||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}poll();setInterval(poll,500)</script></html>
