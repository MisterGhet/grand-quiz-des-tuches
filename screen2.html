<!doctype html><html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Grand Quiz — Manche 2 · Écran Discord</title><style>*{box-sizing:border-box}body{margin:0;background:#020309;color:white;font-family:system-ui,Arial,sans-serif;overflow:hidden}.stage.playing{background:linear-gradient(135deg,#071c52 0%,#0b3c92 55%,#146bc3 100%)}.stage{width:100vw;height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3vh}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1.3vw;width:92vw}.tile{height:17vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:1vw;background:linear-gradient(120deg,#123b85,#2b9ce2);border:2px solid #d5edff;transform:skew(-8deg);font-size:clamp(14px,2vw,29px);font-weight:750;text-shadow:0 1px 3px #08213d}.tile>span{transform:skew(8deg)}.tile.used{background:linear-gradient(120deg,#1a1d26,#393b41);border-color:#6b6b70;color:#8b8c91;text-shadow:none}.title{font-size:clamp(28px,4vw,64px);font-weight:800;text-transform:uppercase;letter-spacing:.18em}.hero{width:85vw;min-height:30vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:4vw;background:linear-gradient(105deg,#0b286e 2%,#1474d3 55%,#4cb2ee 100%);border:4px solid white;clip-path:polygon(8% 0,100% 0,92% 100%,0 100%);font-size:clamp(30px,5.5vw,94px);font-weight:700;letter-spacing:.12em;text-transform:uppercase}.clock{font-size:clamp(100px,17vw,280px);font-weight:800;font-variant-numeric:tabular-nums;line-height:1}.clock.red{color:#ff2d42;text-shadow:0 0 40px #a40022}.bottom{display:flex;align-items:center;justify-content:space-between;width:80vw;font-size:clamp(22px,3vw,55px);font-weight:700}.streak{color:#ffd05b}.hint{color:#aab8d0;font-size:clamp(16px,2vw,26px)}@media(max-width:650px){.grid{grid-template-columns:repeat(2,1fr)}.tile{height:10vh}.hero{min-height:24vh}}</style><main id="stage" class="stage"><div class="hint">Connexion à la manche 2…</div></main><script>
const stage=document.getElementById('stage');let s=null;const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function seconds(){if(!s)return 90;if(s.phase==='running'&&s.startedAt)return Math.max(0,Math.ceil((s.startedAt+s.remaining*1000-Date.now())/1000));return s.seconds}function format(n){return String(Math.floor(n/60)).padStart(2,'0')+':'+String(n%60).padStart(2,'0')}
function render(){if(!s)return;stage.classList.toggle('playing',!['grid','preview'].includes(s.phase));if(s.phase==='grid'){stage.innerHTML=`<div class="title">Grand Quiz — Manche 2</div><div class="grid">${s.themes.map(t=>`<div class="tile ${t.used?'used':''}"><span>${esc(t.name)}</span></div>`).join('')}</div>`}else if(s.phase==='preview'){stage.innerHTML=`<div class="hero">${esc(s.themeName)}</div>`}else{stage.innerHTML=`<div class="title">${esc(s.themeName)}</div><div class="hint">${esc(s.playerName)}</div><div class="clock" id="clock">01:30</div><div class="bottom"><div>${s.streak?'<span class="streak">⚡ STREAK ×2</span>':''}</div><div id="points">${s.points} POINTS</div></div>`}tick()}
function tick(){let c=document.getElementById('clock');if(!c)return;let n=seconds();c.textContent=format(n);c.classList.toggle('red',n<=15)}setInterval(tick,100);async function refresh(){try{let r=await fetch('/api/manche2/state',{cache:'no-store'});if(!r.ok)throw Error('Serveur');let next=await r.json();let changed=!s||s.version!==next.version||s.phase!==next.phase;s=next;if(changed)render()}catch(e){if(!s)stage.innerHTML='<div class="hint">Connexion en attente…</div>'}}setInterval(refresh,750);refresh();
</script></html>
