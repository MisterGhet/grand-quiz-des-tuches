<!doctype html><html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tuches — Joueur</title><style>body{background:#0d1428;color:white;font:18px system-ui;max-width:550px;margin:35px auto;padding:16px;text-align:center}input,button{padding:16px;border:0;border-radius:12px;font:inherit;margin:7px}input{max-width:80%;background:#263653;color:white}button{cursor:pointer;background:#f5c45e;color:#12172a;font-weight:bold}.choices{display:grid;grid-template-columns:1fr 1fr;gap:12px}.choices button{font-size:32px;min-height:110px}.choices button:disabled{opacity:.45}#message{margin:24px 0;color:#f5c45e}small{color:#bac8e0}</style><h1>🏆 Grand Quiz des Tuches</h1><div id="join"><input id="name" placeholder="Ton pseudo" maxlength="32"><input id="room" placeholder="Code de partie" value="TUCHES"><p><button id="joinbtn">Rejoindre</button></p></div><div id="game" hidden><h2 id="title">En attente…</h2><div id="message"></div><div class="choices" id="choices"></div><p><small id="timer"></small></p></div><script>
let token=sessionStorage.getItem('playerToken'),lastRound=-1;const $=id=>document.getElementById(id);async function api(p,method='GET',data){let r=await fetch(p,{method,headers:{'Content-Type':'application/json','x-player-token':token||''},body:data?JSON.stringify(data):undefined});let j=await r.json();if(!r.ok)throw Error(j.error||'Erreur');return j}
$('joinbtn').onclick=async()=>{try{let r=await api('/api/join','POST',{name:$('name').value,room:$('room').value});token=r.token;sessionStorage.setItem('playerToken',token);$('join').hidden=true;$('game').hidden=false;poll()}catch(e){alert(e.message)}};
async function poll(){if(!token)return;try{let s=await api('/api/state'),me=await api('/api/me');$('join').hidden=true;$('game').hidden=false;let open=s.visible&&!s.revealed&&s.deadline&&Date.now()<s.deadline;let answered=me.round===s.round&&me.answer!==null;$('title').textContent=s.visible?'Question '+(s.current+1)+' / 20':'En attente de la prochaine question';$('message').textContent=answered?'Réponse '+ 'ABCD'[me.answer]+' enregistrée et verrouillée ✓':s.revealed?'Réponse correcte : '+ 'ABCD'[s.correct]:!s.visible?'Regarde le partage Discord':!s.deadline?'Écoute la question sur Discord…':open?'Choisis ta réponse maintenant !':'TEMPS ÉCOULÉ';$('timer').textContent=open?'Temps restant : '+Math.ceil((s.deadline-Date.now())/1000)+' s':'';if(s.round!==lastRound){$('choices').innerHTML='';'ABCD'.split('').forEach((letter,i)=>{let b=document.createElement('button');b.textContent=letter;b.onclick=async()=>{try{await api('/api/answer','POST',{round:s.round,answer:i});poll()}catch(e){alert(e.message)}};$('choices').append(b)});lastRound=s.round}Array.from($('choices').children).forEach((b,i)=>{b.disabled=!open||answered;b.style.outline=answered&&me.answer===i?'4px solid #28d18a':''})}catch(e){if(e.message==='Reconnecte-toi'){sessionStorage.removeItem('playerToken');token=null;$('join').hidden=false;$('game').hidden=true}else $('message').textContent=e.message}}
if(token)poll();setInterval(poll,700);
</script></html>
